# Local end-to-end test of the news pipeline.
#   docker compose up --build
#   # then create the tables (anime-api owns them) against this same MySQL:
#   #   cd ../anime-api && DBHOST=127.0.0.1 DBPORT=3306 DBNAME=weeb DBUSERNAME=weeb \
#   #     DBPASSWORD=mysecretpassword go run cmd/main.go migrate up
#   # publish something:
#   curl -XPOST localhost:3000/v1/news -H 'authorization: Bearer localdev' \
#     -H 'content-type: application/json' -d '{"anime_id":"test-1","news":[
#       {"title":"Season 3 confirmed","summary":"…","category":"renewal",
#        "date":"2026-07-28","url":"https://animenewsnetwork.com/news/x","source":"animenewsnetwork.com"}],
#       "fanart":["https://example.com/a.jpg"]}'
#   # rows land in MySQL anime_news / anime_fanart; anime-api then serves them.

services:
  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mysql:
    image: mysql:8.0
    ports: ["3306:3306"]
    environment:
      MYSQL_DATABASE: weeb
      MYSQL_USER: weeb
      MYSQL_PASSWORD: mysecretpassword
      MYSQL_ROOT_PASSWORD: mysecretpassword

  api:
    build: .
    command: ["./main", "serve-api"]
    ports: ["3000:3000"]
    depends_on: [kafka]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGEST_TOKEN: localdev

  consumer:
    build: .
    command: ["./main", "serve-consumer"]
    depends_on: [kafka, mysql]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DBHOST: mysql
      DBNAME: weeb
      DBUSERNAME: weeb
      DBPASSWORD: mysecretpassword
      DBPORT: "3306"
